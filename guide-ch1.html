<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="media/Ch1_words.js" defer></script>
    <script src="script.js" defer></script>
    <title>Finn's Fishbowl</title>
</head>
<body>
    <div id="container" class="pre-begin start-bottom">
        <div class="main-col">
          <div id="start-text">
            <h1>Chapter 1</h1>
            <div class="start-sub" id="instructions">
              <p>
                When the person in front of you
                <br>
                reaches the <b>last footstep</b>,
                <br>
                stand on the <b class="green-footprints">green footprints</b>
              </p>
              <div class="footprints" aria-hidden="true">
                <svg viewBox="0 0 40 66" class="flipped">
                  <g id="foot">
                    <path d="M19 2C29 2 35 9 35 19C35 28 31 34 30 40C29.5 43 27 44 20 44C13 44 10 43 9.5 40C8.5 33 6 27 6 18C6 8 11 2 19 2Z"/>
                    <path d="M10 49C10 47.5 11.5 47 20 47C28 47 29.5 47.5 29.5 49L29.5 55C29.5 61 25.5 64 20 64C14 64 10 61 10 55Z"/>
                  </g>
                </svg>
                <svg viewBox="0 0 40 66"><use href="#foot"/></svg>
              </div>
            </div>
          </div>
          <button type="button" id="play-btn" class="rainbow" data-hide="instructions" onclick="start_narration()">Play<span class="play-icon">&#9654;&#xFE0E;</span></button>
          <div class="audio-div" id="narration-player" style="display:none;">
            <div id="subtitle-area">
              <div id="subtitles" aria-hidden="true"></div>
            </div>
            <audio id="audio" controls controlsList="nodownload" src="media/Ch1-audio-new.mp3" preload="auto"></audio>
          </div>
          <div id="follow-arrow" style="display:none;">
            <p><b class="end-title">Follow the arrows on the ground </b></p>
            <svg class="turn-arrow" viewBox="0 0 240 240" aria-hidden="true">
              <g transform="translate(24 0)" fill="#ED1C24">
                <path d="M170 240V120A40 40 0 0 0 130 80H90" fill="none" stroke="#ED1C24" stroke-width="36"/>
                <polygon points="92,22 92,138 4,80"/>
              </g>
            </svg>
            <p><b class="end-directions"> Take a seat </b></p>
            <a href="guide-ch2.html?play" id="next-btn" class="rainbow">Play Ch. 2</a> 
          </div>

<input type="button" id="transcribe-btn" href="" value="Show Audio Transcription" onclick="toggle_visibility('transcribe-btn', 'transcription-box')"/>

                <br>
                I'm ten years old. Which means I'm fully capable of walking home alone from my best friend's house.

                <br>
                But I must admit. When it's dark out, I get a little scared and wish I had someone with me. Especially… when crossing the field… at night.
                <br>
                <i>Five, six, seven.</i>
                <br>
                The pond should be close now. It's the only thing between me and my exit. I can't see well when it's dark, so I need to count my steps correctly.
                <br>
                <i>Eight</i>
                <br>
                To calm myself down, I think about the fishies that rest in the water. The pond seems quiet and peaceful at night; it must be so cool to sleep in a leaf hammock under the stars.
                <br>
                <i>Nine, ten</i>
                <br>
                Sometimes, when I'm too deep in my imagination, I lose count.
                <br>
                <i>Eleven.</i>
                <br>
                Ah! Ten steps. Ten steps. It takes ten steps to get to the edge of the pond.
                Must tread around the pond lightly now. My house is just up ahead after this last stretch of field. Ten more steps. Same as how I entered.

              </div>

        </div>
    </div>
