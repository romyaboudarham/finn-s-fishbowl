      <div id="container" class="pre-begin home">

              </p>
            </div>

          <button type="button" id="play-btn" class="rainbow" data-hide="start-text" onclick="start_narration()">Begin<span class="play-icon">&#9654;&#xFE0E;</span></button>

          <div class="audio-div" id="narration-player" style="display:none;">

            </div>
            <audio id="intro_audio" controls controlsList="nodownload" src="media/intro_audio-no-ada.mp3" preload="auto" data-next="guide-ch1.html" data-walkman-src="media/ch1-ch2-walkman.mp3"></audio>
